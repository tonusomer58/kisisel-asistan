<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Kişisel Asistan">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Kişisel Asistan</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Beautiful Premium Loading Splash Screen -->
  <div id="loading-indicator">
    <div class="spinner-container">
      <div class="logo">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M21 18V19C21 20.1 20.1 21 19 21H5C3.9 21 3 20.1 3 19V5C3 3.9 3.9 3 5 3H19C20.1 3 21 3.9 21 5V6" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
          <path d="M21 10V14C21 15.1 20.1 16 19 16H11C9.9 16 9 15.1 9 14V10C9 8.9 9.9 8 11 8H19C20.1 8 21 8.9 21 10Z" stroke="#3B82F6" stroke-width="2" stroke-linejoin="round"/>
          <path d="M13 12H17" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <h2 class="title">FinAl</h2>
      <p class="subtitle">Akıllı Finans Asistanı yükleniyor...</p>
      <div class="progress-bar">
        <div class="progress-bar-value"></div>
      </div>
    </div>
  </div>

  <style>
    body {
      background-color: #0A0E17;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #loading-indicator {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #0A0E17;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.5s ease-out;
    }
    .spinner-container {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo {
      margin-bottom: 20px;
      animation: pulse 2s infinite ease-in-out;
    }
    .title {
      color: #FFFFFF;
      margin: 0 0 8px 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .subtitle {
      color: #64748B;
      margin: 0 0 24px 0;
      font-size: 14px;
    }
    .progress-bar {
      width: 200px;
      height: 4px;
      background-color: #1E293B;
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar-value {
      width: 100%;
      height: 100%;
      background-color: #10B981;
      animation: indeterminate 1.5s infinite linear;
      transform-origin: 0% 50%;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; }
    }
    @keyframes indeterminate {
      0% { transform: translateX(-100%) scaleX(0.2); }
      50% { transform: translateX(0%) scaleX(0.5); }
      100% { transform: translateX(100%) scaleX(0.2); }
    }
  </style>

  <script>
    const observer = new MutationObserver(function(mutations) {
      for (let mutation of mutations) {
        for (let node of mutation.addedNodes) {
          if (node.nodeName === 'FLUTTER-VIEW' || node.nodeName === 'FLT-GLASS-PANE') {
            const loader = document.getElementById('loading-indicator');
            if (loader) {
              loader.style.opacity = '0';
              setTimeout(() => {
                loader.remove();
              }, 500);
            }
            observer.disconnect();
            return;
          }
        }
      }
    });
    observer.observe(document.body, { childList: true });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
